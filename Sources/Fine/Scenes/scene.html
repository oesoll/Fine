<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
<title>Fine — ascii.rest</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
  canvas { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); aspect-ratio: 2; }
  #outgoing { pointer-events: none; opacity: 0; }
  /* Fine: 반투명한 사이드바 밑에 놓이는 띠. 같은 렌더러의 살아 있는 장면을 그 자리에서 흐린다. */
  #sidebar-blur { position: absolute; left: 0; top: 0; bottom: 0; width: 0; pointer-events: none;
                  -webkit-backdrop-filter: blur(6px) saturate(1.2); backdrop-filter: blur(6px) saturate(1.2); }
</style>
<canvas id="scene" aria-hidden="true" style="width: max(100vw, 200vh)"></canvas>
<canvas id="outgoing" aria-hidden="true" style="width: max(100vw, 200vh)"></canvas>
<div id="sidebar-blur" aria-hidden="true"></div>
<script src="scene.js"></script>
</html>
