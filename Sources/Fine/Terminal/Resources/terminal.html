<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  :root {
    --terminal-inline-inset: 16px;
    --terminal-block-inset: 12px;
    --status-height: 20px;
    --status-bottom: 8px;
    --footer-crop: 18px;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  #terminal-frame {
    position: absolute;
    inset: var(--terminal-block-inset) var(--terminal-inline-inset) calc(var(--status-height) + var(--status-bottom));
    overflow: hidden;
  }
  #terminal {
    width: 100%;
    height: calc(100% + var(--footer-crop));
  }
  #fine-status {
    position: absolute;
    inset: auto var(--terminal-inline-inset) var(--status-bottom);
    height: var(--status-height);
    box-sizing: border-box;
    border-top: 1px solid rgb(0 0 0 / 7%);
    color: rgb(0 0 0 / 48%);
    font: 500 10px/19px "SF Mono", Menlo, monospace;
    letter-spacing: -0.05px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    user-select: none;
    cursor: pointer;
    border-radius: 4px;
    transition: color 120ms ease, background-color 120ms ease;
  }
  #fine-status:hover {
    color: rgb(0 0 0 / 72%);
    background: rgb(0 0 0 / 3%);
  }
  /* 다크에서는 같은 구조에 잉크만 뒤집는다 — 검정 글자는 어두운 바탕에서 사라진다. */
  html.fine-dark #fine-status {
    border-top-color: rgb(255 255 255 / 10%);
    color: rgb(255 255 255 / 52%);
  }
  html.fine-dark #fine-status:hover {
    color: rgb(255 255 255 / 80%);
    background: rgb(255 255 255 / 6%);
  }
  /* 조합 프리뷰: 한글은 조합 중에도 PTY로 바로 쓰므로 쓰지 않는다. composition 이벤트를 쓰는
     다른 입력기(일본어·중국어)를 위해 네이티브 IME처럼 테마 색 + 밑줄로 남겨 둔다 (기본은 검정 박스) */
  #terminal .composition-view {
    background: var(--term-bg, #1e1e1e);
    color: var(--term-fg, #d4d4d4);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
</style>
</head>
<body>
<div id="terminal-frame"><div id="terminal"></div></div>
<div id="fine-status" aria-hidden="true"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-webgl.js"></script>
<script>
  const term = new Terminal({
    allowProposedApi: true,
    // 홈 장면 위에서는 바탕을 비운다(테마 background가 투명). 불투명 테마에서는 차이가 없다.
    allowTransparency: true,
    cursorBlink: true,
    cursorStyle: 'bar',
    fontSize: 13,
    fontFamily: '"D2Coding", "NanumGothicCoding", "Noto Sans Mono CJK KR", "SF Mono", Menlo, monospace',
    scrollback: 10000,
    macOptionIsMeta: false,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('terminal'));
  try {
    const webgl = new WebglAddon.WebglAddon();
    webgl.onContextLoss(function () { webgl.dispose(); term.refresh(0, term.rows - 1); });
    term.loadAddon(webgl);
  } catch (e) { /* Keep xterm's default renderer when WebGL is unavailable. */ }

  function post(type, payload) {
    window.webkit.messageHandlers.bridge.postMessage({ type: type, payload: payload === undefined ? null : payload });
  }

  // 리스너 등록은 반드시 첫 fit()보다 먼저 — 초기 핏의 리사이즈 이벤트가 유실되면
  // PTY가 시작 크기(80x24)에 영원히 갇힌다
  term.onData(function (d) { post('input', d); });
  term.onResize(function (s) { post('resize', { cols: s.cols, rows: s.rows }); });
  // 한 번도 화면에 붙지 않은 탭(재시작 때 복원된 뒷탭)은 컨테이너가 0x0이라 fit이 최솟값 2x1을
  // 내놓는다. 그게 PTY로 가면 숨은 에이전트가 두 칸 화면에 그리고 `fine read`는 빈 화면을 읽는다
  // (2026-10-27 관측). 크기가 없을 땐 맞추지 않고 직전 크기(처음엔 80x24)를 유지한다.
  function fitIfSized() {
    var d = fit.proposeDimensions();
    if (!d || d.cols < 20 || d.rows < 5) { return; }
    fit.fit();
  }
  fitIfSized();

  // Cmd+C/V/A는 네이티브(Swift)가 처리하므로 xterm이 삼키지 않게 통과시킨다
  term.attachCustomKeyEventHandler(function (e) {
    if (e.metaKey && ['c', 'v', 'a'].indexOf(e.key.toLowerCase()) >= 0) { return false; }
    return true;
  });

  new ResizeObserver(function () { fitIfSized(); }).observe(document.getElementById('terminal'));

  // --- WKWebView 한글 IME 수정 (xterm.js PR #5704 백포트) ---
  // WKWebView는 한글 조합을 composition 이벤트가 아니라 insertText(첫 자모) +
  // insertReplacementText(음절 갱신)로 전달한다. 순정 xterm은 insertText만 PTY로
  // 보내므로 모음/완성 음절이 유실된다. 여기서는 조합 중엔 버퍼+프리뷰만 유지하고,
  // 비IME keydown 또는 새 한글 삽입 시점에 완성 음절을 PTY로 보낸다.
  (function () {
    var core = term._core;
    if (!core || !core.textarea) { return; }

    function isHangul(t) {
      var cp = t.codePointAt(0);
      return !!cp && ((cp >= 0x1100 && cp <= 0x11FF) || (cp >= 0x3130 && cp <= 0x318F) ||
                      (cp >= 0xAC00 && cp <= 0xD7AF) || (cp >= 0xA960 && cp <= 0xA97F) ||
                      (cp >= 0xD7B0 && cp <= 0xD7FF));
    }

    // 조합 중인 음절도 곧바로 PTY에 쓴다 — 일반 터미널의 bash처럼 미리보기 없이 입력창에서 글자가
    // 바로 자라난다. 음절이 갱신되면(ㄱ→가→각) 방금 보낸 만큼 DEL로 지우고 새 음절을 쓴다.
    // CLI 입력창(Claude·Codex·zsh)은 DEL을 앞 글자 하나 지우기로 처리한다.
    var composing = false;
    var sent = '';           // PTY에 이미 나간, 아직 바뀔 수 있는 음절
    var suppressDiffUntil = 0;

    function send(text) { if (text) { core.coreService.triggerDataEvent(text, true); } }

    // WKWebView는 compositionend를 주지 않아 커밋된 음절이 textarea에 남는다. 이 잔여물을
    // CompositionHelper의 지연 diff 경로가 주워 한 번 더 보내면 "글글짜" 식 이중 입력이 된다.
    // 음절이 닫힐 때마다 잔여물과 diff 기준점을 비우고, 예약된 diff가 소진될 동안 경로를 막는다.
    function settle() {
      suppressDiffUntil = performance.now() + 80;
      if (core.textarea) { core.textarea.value = ''; }
      if (ch) { ch._dataAlreadySent = ''; }
    }

    function close() {
      if (!composing) { return; }
      composing = false;
      sent = '';
      settle();
    }

    // keyCode 229 keydown마다 textarea 변경분을 흘려보내는 CompositionHelper 경로는
    // 조합 중 + 음절이 닫힌 직후 잠깐 차단한다(위 settle 주석의 이중 입력 방지)
    var ch = core._compositionHelper;
    if (ch && typeof ch._handleAnyTextareaChanges === 'function') {
      var origChanges = ch._handleAnyTextareaChanges.bind(ch);
      ch._handleAnyTextareaChanges = function () {
        if (!composing && performance.now() >= suppressDiffUntil) { origChanges(); }
      };
    }

    // 지금 macOS의 WKWebView는 한글을 표준 composition 이벤트로도 준다. 이때 xterm의 CompositionHelper가
    // 밑줄 프리뷰를 띄우고 compositionend에 몰아 보낸다 — 이 경로도 같은 즉시 쓰기로 돌린다.
    // 리스너는 호출 시점에 메서드를 찾으므로 인스턴스 메서드를 바꾸면 된다.
    var endedAt = 0, ended = '';
    function replace(text) {
      send('\x7f'.repeat(Array.from(sent).length) + text);
      sent = text;
    }
    if (ch) {
      ch.compositionstart = function () { close(); composing = true; sent = ''; };
      ch.compositionupdate = function (ev) {
        composing = true;
        if (ev && typeof ev.data === 'string') { replace(ev.data); }
      };
      ch.compositionend = function () {
        // 마지막 update가 이미 최종 음절을 썼다. 같은 음절이 insertText로 한 번 더 오면 버린다.
        ended = sent;
        endedAt = performance.now();
        close();
      };
    }

    // xterm은 compositionend의 데이터를 넘기지 않는다. 최종 음절이 마지막 update와 다르면 맞춰 둔다.
    // 조상 요소의 캡처 단계라 textarea에 걸린 xterm 리스너보다 먼저 실행된다.
    term.element.addEventListener('compositionend', function (e) {
      if (composing && typeof e.data === 'string' && e.data !== sent) { replace(e.data); }
    }, true);

    var origInputEvent = core._inputEvent.bind(core);
    core._inputEvent = function (ev) {
      if (ev.data && ev.inputType === 'insertReplacementText' && !term.options.screenReaderMode) {
        // 지금 음절의 갱신: 보낸 글자 수(코드 포인트)만큼 지우고 새로 쓴다
        replace(ev.data);
        composing = true;
        ev.preventDefault();
        ev.stopPropagation();
        return true;
      }
      if (composing && !ev.data && (ev.inputType === 'deleteContentBackward' || ev.inputType === 'insertReplacementText')) {
        // 백스페이스로 마지막 자모까지 지워 조합이 비었다: 보낸 만큼 PTY에서도 지운다
        send('\x7f'.repeat(Array.from(sent).length));
        close();
        ev.preventDefault();
        ev.stopPropagation();
        return true;
      }
      if (ev.data && ev.data === ended && performance.now() - endedAt < 80) {
        ended = '';
        ev.preventDefault();
        ev.stopPropagation();
        return true;
      }
      if (ev.data && ev.inputType === 'insertText' && isHangul(ev.data) && !term.options.screenReaderMode) {
        // 새 음절의 첫 자모: 앞 음절은 이미 PTY에 있으니 닫기만 하고 새 자모를 쓴다
        close();
        send(ev.data);
        sent = ev.data;
        composing = true;
        ev.preventDefault();
        ev.stopPropagation();
        return true;
      }
      return origInputEvent(ev);
    };

    // 비IME keydown(스페이스/엔터/화살표 등)이 xterm 키 처리로 들어가기 전에 조합을 닫는다.
    // 캡처 단계 + 조상 요소 등록이라 textarea에 걸린 xterm 리스너보다 항상 먼저 실행된다.
    // 보조 키는 조합을 닫지 않는다 — ㅆ·ㄲ처럼 Shift로 치는 자모에서 Shift를 누르는 순간 조합을 닫고
    // textarea를 비우면 입력기 버퍼가 끊겨 "있"이 "이ㅆ"으로 갈라진다.
    var MODIFIERS = { Shift: 1, Control: 1, Alt: 1, Meta: 1, CapsLock: 1, Fn: 1, Lang1: 1, Lang2: 1, HangulMode: 1 };
    term.element.addEventListener('keydown', function (e) {
      if (composing && e.keyCode !== 229 && !MODIFIERS[e.key] && [16, 17, 18, 20, 91, 93].indexOf(e.keyCode) < 0) { close(); }
    }, true);
  })();

  // Swift가 호출하는 API
  window.smWrite = function (b64) {
    const raw = atob(b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) { bytes[i] = raw.charCodeAt(i); }
    term.write(bytes); // 바이트 단위 write — 멀티바이트(UTF-8) 경계는 xterm 디코더가 처리
  };
  window.smPaste = function (text) { term.paste(text); };
  // CLI(fine read)가 화면을 읽는 창구 — tmux capture-pane에 해당한다.
  // 스크롤백 포함 버퍼의 마지막 n줄을 평문으로 돌려준다(빈 꼬리 줄은 잘라낸다).
  window.smReadLines = function (n) {
    const buf = term.buffer.active;
    let total = buf.length;
    while (total > 0 && !buf.getLine(total - 1).translateToString(true).trim()) total--;
    const start = Math.max(0, total - n);
    const out = [];
    for (let i = start; i < total; i++) {
      const line = buf.getLine(i);
      const text = line ? line.translateToString(true) : '';
      if (line && line.isWrapped && out.length) out[out.length - 1] += text;
      else out.push(text);
    }
    while (out.length && out[out.length - 1] === '') { out.pop(); }
    return out.join('\n');
  };
  window.smGetSelection = function () { return term.getSelection(); };
  window.smSelectAll = function () { term.selectAll(); };
  window.smFocus = function () { term.focus(); };
  window.smFit = function () { try { fitIfSized(); } catch (e) {} };
  window.smRefresh = function () {
    window.smFit();
    term.refresh(0, term.rows - 1);
  };
  // 하네스별 하단 크롭: Claude Code의 힌트 행만 Fine 상태줄로 대체하고,
  // 자체 입력/상태 행을 그리는 OpenCode는 한 줄도 가리지 않는다.
  window.smSetFooterCrop = function (px) {
    document.documentElement.style.setProperty('--footer-crop', (px || 0) + 'px');
    try { fitIfSized(); } catch (e) {}
  };
  /* 터미널은 WKWebView라 앱의 colorScheme이 닿지 않는다. 네이티브가 직접 알려준다. */
  window.smSetScheme = function (dark) {
    document.documentElement.classList.toggle('fine-dark', !!dark);
  };
  window.smSetStatus = function (status) {
    document.getElementById('fine-status').textContent = status || '';
  };
  document.getElementById('fine-status').addEventListener('click', function () {
    post('statusClick');
  });
  window.smSetTheme = function (theme, minimumContrastRatio) {
    if (minimumContrastRatio !== undefined) { term.options.minimumContrastRatio = minimumContrastRatio; }
    term.options.theme = theme;
    document.documentElement.style.setProperty('--term-bg', theme.background);
    document.documentElement.style.setProperty('--term-fg', theme.foreground);
    /* WebGL 렌더러는 붙을 때의 색을 들고 있다. 테마만 바꾸면 화면은 그대로이므로
       전체를 다시 그리게 한다. */
    try { term.refresh(0, term.rows - 1); } catch (e) { /* 아직 열리기 전이면 무시한다. */ }
  };

  /* 지금 xterm이 실제로 쓰고 있는 선택 색. 눈으로 못 보는 것을 확인하기 위한 통로다. */
  window.smThemeReport = function () {
    var t = term.options.theme || {};
    return JSON.stringify({
      background: t.background, foreground: t.foreground,
      selectionBackground: t.selectionBackground,
      selectionInactiveBackground: t.selectionInactiveBackground,
      selectionForeground: t.selectionForeground,
      minimumContrastRatio: term.options.minimumContrastRatio,
    });
  };

  post('ready', { cols: term.cols, rows: term.rows });
</script>
</body>
</html>
